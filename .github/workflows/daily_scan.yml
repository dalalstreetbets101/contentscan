name: Daily Content Scan & Auto-Publish

on:
  schedule:
    # 12:30 PM UTC = 6:00 PM IST (Daily)
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scan-compile-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily RSS Scanner
        run: |
          python run_scan.py

      - name: Compile Daily Report & Distribute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python auto_compile_api.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ candidates.json history.json data.js last_scan_date.txt
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Daily content scan & report update [skip ci]"
            git push
          fi
